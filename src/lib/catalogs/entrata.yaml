  - endpoint_name: get_customers
    vendor_method: getCustomers
    endpoint_group: customers
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/customers
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getCustomers
        version: r1
        params:
          propertyId: '{property_id}'
    response_shape_summary: |
      Returns one row per customer (tenant) at the property:
      { "@attributes": { "Id": "<id>" }, NamePrefix, FirstName, LastName,
        Email, Phone, DOB, LeaseId, CustomerType: ["Primary" | "CoApplicant"
        | "Guarantor"], MoveInDate }.
      Customer ID lives on a nested @attributes sub-object (XML-to-JSON
      artifact); top level is PascalCase.
    plain_english_description: |
      Returns tenant identity records for a property — name, contact info,
      date of birth, lease attachment. Distinct from get_leases, which
      embeds a thin "primary customer" object; get_customers returns ALL
      customers attached to ALL leases on the property, including
      co-applicants and guarantors. The same customer can appear once per
      attached lease (a co-applicant on two leases shows up twice on the
      same page), which is why the adapter dedupes same-batch on
      (org_id, customer_id) before upsert to avoid Postgres
      cardinality_violation. Use propertyId (singular) — passing
      propertyIds (plural) trips Entrata error 303 on every call.
    use_cases:
      - tenant_directory
      - contact_capture
      - co_applicant_tracking
    cost_class: moderate
    rate_limit_class: standard
    synced_to_table: entrata_customers
    sync_status: active
    live_example_response_redacted: |
      {
        "response": {
          "result": {
            "Customers": {
              "Customer": [
                { "@attributes": { "Id": "1091957" },
                  "NamePrefix": "Ms.",
                  "FirstName": "Jane", "LastName": "Doe",
                  "Email": "...", "LeaseId": { "id": "55501" },
                  "CustomerType": ["Primary"],
                  "MoveInDate": "01/15/2025" }
              ]
            }
          }
        }
      }
    adapter_quirks: |
      Per-property iteration. PascalCase top-level keys with @attributes
      sub-object for ID. LeaseId is sometimes a nested object
      {id, "@value"} and sometimes a flat string — adapter normalizes
      with multi-key fallback. Phone occasionally arrives as nested
      {Phone.PhoneNumber} and otherwise flat — the adapter normalizes both.
