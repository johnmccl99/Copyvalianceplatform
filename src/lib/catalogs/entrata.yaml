vendor: entrata
schema_version: 1
last_reviewed: '2026-05-21'
auth:
  primary:
    mode: partner_gateway
    base_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1
    base_url_template_eu: https://apis.entrata.global/ext/orgs/{subdomain}/v1
    header: 'X-Api-Key: <api_key>'
    notes: |
      Partner-tier path used by this platform. The API key is captured per-org via
      the admin-only entrata-connect.js Netlify function, encrypted server-side
      via the entrata_encrypt_api_key() Supabase RPC, and stored in
      org_entrata_accounts.api_key_encrypted. Decryption happens server-side at
      sync time only — the key never reaches the browser.
  fallback:
    mode: public_portal
    base_url_template: https://{subdomain}.entrata.com/api/v1
    header: 'Authorization: Basic <base64(user:password)>'
    notes: |
      Public developer-portal flavor, used by integrators that authenticate with
      HTTP Basic instead of a partner API key. This platform does not use this
      path today; the auth header shape and the per-method route ("/api/customers"
      vs "/v1/customers", lowercase plural) differ from the partner gateway and
      are NOT drop-in compatible. Documented here for completeness.
  oauth_app_store:
    mode: bearer_token
    token_endpoint: https://sync.entrata.com/api/oauth
    service_url_template: https://{subdomain}.entrata.com/api/{service}
    header: 'Authorization: Bearer <access_token>'
    notes: |
      OAuth 2.0 flow used by published Entrata App Store apps. Not in scope for
      this platform; documented because the App Store technical docs are the
      most reliable public surface for sample request bodies.
rate_limits:
  documented_quota: |
    One (1) call to the API per client per property per minute per web service,
    not to exceed 2,500 calls in a twenty-four (24) hour period. Verbatim from
    the Entrata API Developer Interface Agreement section 4.

    This is the CONTRACT text, not what the gateway actually enforces — see
    measured_quota below. Treat it as the ceiling you are contractually
    entitled to complain about, not as the number to engineer against.
  measured_quota: |
    Entrata's live rate limits are bucketed PER METHOD, not per tenant. Every
    API method carries its own day / hour / minute allowance, and a method's
    own x-ratelimit-limit response header is the only authority for that
    method's bucket. There is no single account-wide ceiling to engineer
    against.

    Buckets as reported by x-ratelimit-limit response headers for this
    tenant:

      financial.getGlTransactions      10000/day;   6000/hour;   150/minute
      vendors.getInvoices               5000/day;    300/hour;   200/minute
      financial.getFinancialPickList    1000/day;    150/hour;    60/minute
      artransactions.getArInvoices      1000/day;    100/hour;    60/minute

    Note how little those have in common. The hourly allowance spans 100 to
    6000 — a 60x range across four methods on the same account — and the
    minute allowance does not track the hourly one: vendors.getInvoices
    permits 200/minute against only 300/hour, so it tolerates a short burst
    but not a sustained walk. Any method not listed above is UNMEASURED. Read
    its own header before sizing anything against it; do not interpolate from
    a sibling method.

    Do not design against an asserted Entrata ceiling of "60 requests per minute" and "100 per hour".
    The 60/minute number came only from the prose inside a 429 response body
    ("You reached the limit of 60 requests per 1 minutes"), never from an
    advertised limit, and it is not a design constant.

    Practical consequence for sync design: budget PER METHOD, not per sync. A
    resource whose adapter entry sets iterate_per_property fires at least one
    call per property (more with pagination) against a SINGLE method's bucket,
    so it can exhaust that method on its own while every other method on the
    account stays untouched. A "total calls per sync" figure says nothing
    about whether any individual resource will 429. Do not size a client-side
    throttle off any fixed number — drive pacing off the live x-ratelimit-*
    headers returned by the call actually being made, which is what the
    adapter does.
  enforcement: |
    The platform captures Entrata's X-RateLimit-Minute-Remaining / Hour / Day
    response headers on every call and persists them to
    org_entrata_accounts.rl_minute_remaining / hour / day so the admin UI can
    warn before the cap is hit.

    Exceedance is NOT silent — Entrata returns HTTP 429 with Entrata error
    code 1429 and a human-readable message. No Retry-After header is
    returned.
  retry_stance: |
    The adapter retries TypeError-class network failures (TCP/TLS reset, DNS
    flakes) up to 3 times with 400ms * attempt^2 backoff. HTTP non-2xx
    responses pass through to the caller; no automatic retry on 4xx or 5xx
    because Entrata occasionally returns 500 for genuine validation errors
    that re-running will not fix.
  ip_whitelisting: |
    Per the API Developer Interface Agreement section 5, Entrata whitelists
    the developer's egress IP address(es) before access works. Netlify
    Functions on the standard tier do not have static egress IPs, so
    production traffic depends on either Netlify Enterprise, a fixed-IP
    relay, or a partner-level allowlist exception covering Netlify's pools.
request_envelope:
  shape: |
    All Entrata RPC calls use a JSON envelope:
      {
        "auth": { "type": "apikey" },
        "requestId": <integer; unused for correlation server-side, but required>,
        "method": {
          "name": "<methodName>",
          "version": "<r1|r2|r3>",
          "params": { ... }
        }
      }
    Some paginated endpoints (getLeases, getInvoices) accept top-level
    `page_no` and `per_page` parameters outside the method envelope; the
    adapter sends these as siblings of `method`, not inside `params`.
  content_type: application/json; charset=utf-8
  response_unwrap_pattern: |
    Successful responses nest data under `response.result.<methodSpecificPath>`.
    The exact path varies by method and sometimes by tenant (PascalCase
    vs lowerCamelCase, plural vs singular wrapper). The adapter records the
    top-level keys of the first empty response per resource into the diag
    payload so resultPath mismatches surface without a separate audit pass.
  date_format: MM/DD/YYYY for most params (not ISO 8601). Verify per method via the relevant pickList.
  pagination: Page-number + page-size when paginated. No cursors.
endpoints:
  - endpoint_name: get_status
    vendor_method: getStatus
    endpoint_group: system
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/status
    request_body_template:
      auth:
        type: apikey
      requestId: 1
      method:
        name: getStatus
        version: r1
        params: {}
    response_shape_summary: |
      Returns a small health envelope confirming the API is reachable and the
      credentials are valid. The platform's entrata-connect.js uses this as a
      credential-validation probe at connect time.
    plain_english_description: |
      The liveness probe for Entrata's API. Call this before a batch run to
      confirm the API is up, the gateway is routing correctly, and the
      provisioned API key still authenticates. Used by the platform's
      entrata-connect.js function to validate newly captured credentials
      before persisting them — if this returns 200, the rest of the sync
      pipeline will at least reach Entrata. The response payload itself is
      uninteresting; what matters is the HTTP status and the timing.
    use_cases:
      - health_check
      - credential_validation
    cost_class: cheap
    rate_limit_class: standard
    synced_to_table: null
    sync_status: not_wired
    notes: |
      Called inline by entrata-connect.js (not via the adapter's resource
      dispatch). Excluded from the scheduled sweep because there is nothing
      to persist; a credential failure would show up on the next real sync
      anyway.
  - endpoint_name: get_properties
    vendor_method: getProperties
    endpoint_group: properties
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/properties
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getProperties
        version: r1
        params: {}
    response_shape_summary: |
      Returns one row per property the credential has access to:
      { PropertyID, MarketingName, ShortDescription, Website, Phone, Email,
        Address: { Address, City, StateCode, PostalCode, Country },
        YearBuilt, NumberOfUnits, IsDisabled, Type }.
      Top-level wrapper varies by tenant — PhysicalProperty.Property (most
      common) or properties.property (alternate). The platform's pickArray
      helper tries both.
    plain_english_description: |
      The seed call for everything else in the catalog. Returns the management
      company's full property roster — IDs, marketing names, addresses, unit
      counts, disabled-state. Every other read-side endpoint takes a
      propertyId or propertyIds parameter, so the platform syncs this first
      and gates subsequent resource pulls behind a "no entrata_properties
      rows yet" loud error. The response shape is mixed-case (PascalCase
      Address with camelCase fallbacks); the adapter normalizes both. It is
      cheap (single call, no pagination) and safe to refresh frequently.
    use_cases:
      - property_roster
      - tenant_onboarding
      - portfolio_summary
    cost_class: cheap
    rate_limit_class: standard
    synced_to_table: entrata_properties
    sync_status: active
    live_example_response_redacted: |
      {
        "response": {
          "result": {
            "PhysicalProperty": {
              "Property": [
                { "PropertyID": "12345", "MarketingName": "12 Panoramic",
                  "Address": { "Address": "12 Panoramic Way", "City": "...",
                               "StateCode": "...", "PostalCode": "..." },
                  "NumberOfUnits": 8, "Type": "Multi-Family" }
              ]
            }
          }
        }
      }
    adapter_quirks: |
      No pagination. Dual resultPath (PhysicalProperty.Property primary,
      properties.property fallback). Normalizes mixed PascalCase / camelCase
      key shapes. Coerces IsDisabled (string "true" or boolean true to bool).
  - endpoint_name: get_property_units
    vendor_method: getPropertyUnits
    endpoint_group: properties
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/propertyunits
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getPropertyUnits
        version: r1
        params:
          propertyIds: '{property_id}'
    response_shape_summary: |
      Returns property -> floorplans -> unit types -> units, including unit
      number, bedrooms, bathrooms, square footage, building name, and a
      nested unitSpaces array carrying per-bedroom market rent. The adapter
      sums marketRent across unitSpaces to compute a single market-rent
      figure per unit.
    plain_english_description: |
      The unit-level structural call. Returns every unit on the requested
      property, with the metadata (bedrooms, bathrooms, square footage,
      market rent, building name) needed to populate the platform's
      unit-inventory tables. Distinct from get_leases — this is the static
      unit roster; lease-level occupancy and tenant identity come from
      get_leases joined back on unit_id. Note that Entrata limits this
      method to one propertyId per call (not propertyIds[] despite the
      param name), so a portfolio refresh iterates the property list
      sequentially with a short per-property delay to avoid TLS resets.
    use_cases:
      - unit_inventory
      - market_rent_baseline
      - capacity_planning
      - rent_roll_composition
    cost_class: moderate
    rate_limit_class: standard
    synced_to_table: entrata_units
    sync_status: active
    live_example_response_redacted: |
      {
        "response": {
          "result": {
            "properties": {
              "property": [
                { "id": "12345",
                  "units": {
                    "unit": [
                      { "id": "9001", "unitNumber": "101", "numberOfBedrooms": 2,
                        "squareFeet": 1100, "buildingName": "A",
                        "unitSpaces": { "unitSpace": [
                          { "marketRent": 1800 }, { "marketRent": 1800 }
                        ] } }
                    ]
                  }
                }
              ]
            }
          }
        }
      }
    adapter_quirks: |
      Per-property iteration with 120ms throttle between calls. Response
      nests under properties.property[].units.unit[] in lowerCamelCase. Market rent is summed
      across the unitSpaces array (one space per bedroom) rather than read
      from a single column.
  - endpoint_name: get_property_pick_lists
    vendor_method: getPropertyPickLists
    endpoint_group: properties
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/properties
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getPropertyPickLists
        version: r1
        params: {}
    response_shape_summary: |
      Returns the ID-to-name enumeration tables that other Properties-service
      responses reference: unit type IDs, status IDs, building IDs,
      floorplan IDs.
    plain_english_description: |
      The lookup-tables call for the Properties service. Other endpoints
      reference unit-type IDs, status IDs, and building IDs without spelling
      out the name; this call returns the mapping. Call once at integration
      bootstrap (or whenever the management company adds a new unit type)
      and cache the result. Not needed for the current sync —
      property and unit data already arrives with names attached — but
      becomes necessary when consuming raw IDs from getPropertyUnits' more
      detailed sub-objects.
    use_cases:
      - id_resolution
      - enum_caching
      - reporting_dimensions
    cost_class: cheap
    rate_limit_class: standard
    synced_to_table: null
    sync_status: not_wired
    verify_with_partner: false
  - endpoint_name: get_phone_number
    vendor_method: getPhoneNumber
    endpoint_group: properties
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/properties
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getPhoneNumber
        version: r1
        params:
          propertyIds: '{property_id}'
    response_shape_summary: |
      Returns the marketing and leasing-center phone numbers configured per
      property.
    plain_english_description: |
      Surfaces the marketing-side phone numbers used in lead-routing and
      call-tracking. Useful when integrating with a separate call-tracking
      provider that needs to know which Entrata-managed phone number maps
      to which property. Not on the rent-roll critical path; not synced
      today.
    use_cases:
      - call_tracking
      - marketing_attribution
    cost_class: cheap
    rate_limit_class: standard
    synced_to_table: null
    sync_status: not_wired
  - endpoint_name: get_amenity_reservations
    vendor_method: getAmenityReservations
    endpoint_group: properties
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/properties
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getAmenityReservations
        version: r1
        params:
          propertyId: '{property_id}'
    response_shape_summary: |
      Returns scheduled amenity reservations (clubhouse, fitness room, pool,
      etc.) per property with reservation window, reserving customer, and
      status.
    plain_english_description: |
      The reservation log for shared amenities — clubhouses, fitness rooms,
      grills, business centers. Useful for operations dashboards showing
      amenity utilization or for billing surcharges tied to reservations.
      Not on the financial reporting or rent-roll path; carried in the
      catalog for future ops-side surfaces.
    use_cases:
      - amenity_utilization
      - operations_dashboard
    cost_class: moderate
    rate_limit_class: standard
    synced_to_table: null
    sync_status: not_wired
  - endpoint_name: get_floor_plans
    vendor_method: getFloorPlans
    endpoint_group: properties
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/properties
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getFloorPlans
        version: r1
        params:
          propertyId: '{property_id}'
    response_shape_summary: |
      Returns the floor plans (unit layouts) configured for a property:
      floor-plan name plus bedroom/bathroom counts and square footage. Rows
      live at FloorPlans.FloorPlan (PascalCase primary; floorplans.floorplan
      is the lowercase fallback shape). The per-row floor-plan ID lives at
      Identification.IDValue, not @attributes.Id.
    plain_english_description: |
      The per-property floor-plan roster — the structural unit layouts a
      property offers (e.g. "2 Bed | 2 Bath", "Studio"). Distinct from
      get_property_pick_lists, which only returns the floor-plan ID-to-name
      enumeration as one of several lookup arrays; this call returns the full
      floor-plan objects. Must be called per-property with the singular
      propertyId param — both the org-level "params: {}" shape and the plural
      propertyIds shape return Entrata error 302 "Request parameters are
      missing". Synced into the entrata_property_meta catch-all table under
      kind='floor_plan' via the mapEntrataFloorPlanToRow mapper, through the
      adapter resource property_meta_floor_plans.
    use_cases:
      - unit_structure
      - floor_plan_reporting
      - rent_roll_enrichment
    cost_class: cheap
    rate_limit_class: standard
    synced_to_table: entrata_property_meta
    sync_status: defined
  - endpoint_name: send_rentable_items
    vendor_method: sendRentableItems
    endpoint_group: properties
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/properties
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: sendRentableItems
        version: r1
        params:
          propertyId: '{property_id}'
          rentableItems: '{rentable_items_array}'
    response_shape_summary: |
      Returns confirmation of inserted/updated rentable-item rows (parking
      spots, storage, pet add-ons) along with any per-item errors.
    plain_english_description: |
      A write-mode endpoint that pushes rentable-item definitions (parking
      stalls, storage units, pet add-ons) into Entrata. Not wired; carried
      as the write-side counterpart for a future write-side feature backed
      by Entrata. Never call this from a sync sweep.
    use_cases:
      - property_setup
      - rentable_inventory_management
    cost_class: cheap
    rate_limit_class: standard
    synced_to_table: null
    sync_status: not_wired
    is_write: true
  - endpoint_name: get_unit_availability
    vendor_method: getUnitsAvailabilityAndPricing
    endpoint_group: units
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/propertyunits
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getUnitsAvailabilityAndPricing
        version: r1
        params:
          propertyId: '{property_id}'
          arePricesRequired: 'true'
    response_shape_summary: |
      Returns a point-in-time snapshot of unit availability and dynamic
      pricing for each unit on the property: unit, status (vacant / leased /
      notice / leased-not-occupied), available date, advertised rate, and
      any active concessions.
    response_shape_verified: |
      The envelope is MITS/ILS-shaped with exactly TWO top-level result
      keys:

        response.result.Properties.Property[]   -- floorplan-grain marketing
            data (PropertyId, MarketingName, currencyCode,
            propertyAvailabilityURL, Floorplans.Floorplan[]). NO unit rows.
        response.result.ILS_Units.Unit          -- the unit-grain data, as a
            keyed OBJECT MAP whose keys are PropertyUnitIds, NOT an array.

      Each unit node is
        { "@attributes": { UnitNumber, FloorPlanName, Availability
              ("Available" | "Not Available"), Status ("Vacant Ready
              (Available)" | "Vacant Not Ready (Unavailable)" | "Occupied
              (Unavailable)" | "On Notice (Available)" | "On Notice
              (Unavailable)"), AvailableOn (MM/DD/YYYY), MakeReadyDate,
              FloorplanId, UnitTypeId, PropertyUnitId, PropertyId, FloorId,
              FloorNumber, BuildingId, BuildingName, OccupancyType,
              IsAffordable, HasPricing, WebVisible, Area ("271.0000
              SquareFeet") },
          "Rent":    { TermRent: [{ "@attributes": { Rent, BaseRent } }],
                       "@attributes": { MinRent, MaxRent } },
          "Deposit": { "@attributes": { MinDeposit, MaxDeposit } } }

      There is NO concessions block on this tenant's response, and no
      per-term label on TermRent (exactly one TermRent entry per unit).
      PropertyUnitId is the same id space as entrata_units.unit_id, so
      availability joins the unit roster directly.

      CAVEAT -- pricing is zeroed on this tenant. Every unit carries a
      complete Rent block, and the entire Rent subtree contains exactly FOUR
      distinct scalar leaves -- MinRent, MaxRent, TermRent[].Rent,
      TermRent[].BaseRent -- every one of them the string "0.00". True for
      HasPricing="1" and HasPricing="0" units alike, available and occupied
      alike. Sending the documented arePricesRequired: "true" param changes
      nothing (byte-identical response).

      Consequence for the adapter: asking_rent is NULL on 100% of rows for
      this tenant, by design. 0 in this feed means "no rate published", not
      "this unit is free"; persisting the 0 would read downstream as a 100%
      loss-to-lease on every unit. lease_term_months and concession_amount
      are likewise NULL on 100% of rows because neither field exists in the
      envelope -- TermRent carries only Rent and BaseRent (no term label, id
      or month count), and every unit node's key set is exactly
      ["@attributes", "Rent", "Deposit"] with no concessions block.

      Do NOT substitute the floorplan-grain MarketRent from the Properties
      branch of this same response. The FloorplanId join is clean, but the
      Min/Max range spans shared-by-bed to entire-unit pricing and can reach
      roughly 10x within one floorplan. Pushing either end down to unit
      grain invents a number.

      Real unit-grain market rent lives on get_property_units, which carries
      non-zero values: units[].unitSpaces.unitSpace[].marketRent and the sibling
      unitSpaces[].rent.termRent[] array, which unlike the ILS feed DOES
      carry leaseTermId / leaseTerm ("10 Months") / leaseTermName /
      spaceOption and non-zero rent + baseRent. Loss-to-lease and the
      renewal trade-out column must source market rent there until ILS
      pricing is configured in the tenant's Entrata.
    plain_english_description: |
      The forward-looking availability and revenue-management feed.
      get_property_units returns the static unit roster (bedrooms, square
      footage, base market rent); this returns what each unit is being
      offered for TODAY, including any LRO / RealPage-style dynamic
      pricing or one-off concessions. Use this when building a
      pricing-analysis surface or a forward-occupancy projection.
      Note the snapshot semantics — entrata_unit_availability is append-only
      in the schema (as_of timestamp on every row) so the platform can
      reconstruct historical pricing curves. Method name is the most
      common one in the wild but verify the exact spelling and version
      with Entrata partner support before wiring an adapter handler.
    use_cases:
      - availability_snapshot
      - revenue_management
      - forward_occupancy
      - pricing_history
    cost_class: moderate
    rate_limit_class: standard
    synced_to_table: entrata_unit_availability
    sync_status: defined
    verify_with_partner: true
  - endpoint_name: get_leases
    vendor_method: getLeases
    endpoint_group: leases
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/leases
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getLeases
        version: r1
        params:
          propertyId: '{property_id}'
      page_no: <int>
      per_page: 500
    response_shape_summary: |
      Returns one row per lease with: leaseId, unitId, unitNumber, status,
      lease_start_date, lease_end_date, move_in_date, move_out_date, rent,
      deposit, primary_customer (nested object with id, name, email),
      leaseInterval (status + dates), scheduledCharges (array of recurring
      charges including Base Rent and Security Deposit), is_mtm flag.
      With leaseStatusTypeIds omitted the rows are Current + Notice ONLY
      (see plain_english_description) — not the full status spread.
    plain_english_description: |
      The platform's primary lease-level fact source — the table this
      writes to (entrata_leases) is what every rent-roll surface ultimately
      joins back on.

      Omitting leaseStatusTypeIds does NOT return every status. It returns
      ONLY status ids 4 (Current) and 5 (Notice), so every row in
      entrata_leases carries raw->>'leaseStatusTypeId' of 4 or 5. Past,
      Future, Applicant and Cancelled leases exist in Entrata but are never
      ingested on the omitted-filter call, so a pre-lease / future-lease
      report built on that data reads empty.

      The full per-tenant vocabulary, from getLeasePickList
      (POST /v1/leases, method getLeasePickList, params {}):

        1 = Applicant
        2 = Cancelled
        3 = Future
        4 = Current
        5 = Notice
        6 = Past

      That is the complete set. There is NO "Evicted" status id, and
      requesting ids beyond 6 trips Entrata error 306. Evictions and skips
      are carried in the separate leaseSubStatus TEXT field (for example
      "Eviction, Month To Month" and "Skip, Month To Month"), and a dedicated
      getEvictedLeases method exists for the eviction population. So
      "past / skip / termination / eviction" maps to id 6 plus
      leaseSubStatus filtering, never to distinct status ids.

      Filter on leaseStatusTypeId, not on dates: a future-lease report
      keyed on lease_start_date > current_date both misses Future leases
      whose start date has passed and wrongly includes future-dated
      Cancelled rows.

      Pagination is offset-based, 500 per page; the adapter caps at page
      200 as a safety. One
      lease can appear multiple times within a page when a co-applicant is
      attached to multiple leases on one property, so the adapter dedupes
      same-batch on (org_id, lease_id) with last-write-wins before upsert
      to avoid Postgres cardinality_violation on ON CONFLICT DO UPDATE.
    use_cases:
      - rent_roll
      - tenant_directory
      - occupancy
      - lease_expiration_pipeline
      - mtm_identification
    cost_class: expensive
    rate_limit_class: standard
    synced_to_table: entrata_leases
    sync_status: active
    live_example_response_redacted: |
      {
        "response": {
          "result": {
            "leases": {
              "lease": [
                { "id": "55501", "unitId": "9001", "unitNumber": "101",
                  "leaseStatus": "Current",
                  "leaseStartDate": "01/15/2025",
                  "leaseEndDate": "01/14/2026",
                  "customers": { "customer": [
                    { "customerType": ["Primary"],
                      "@attributes": { "Id": "1091957" },
                      "FirstName": "Jane", "LastName": "Doe",
                      "MoveInDate": "01/15/2025" }
                  ] },
                  "scheduledCharges": { "scheduledCharge": [
                    { "chargeCode": "Base Rent", "amount": "1800.00" },
                    { "chargeCode": "Security Deposit", "amount": "1800.00" }
                  ] }
                }
              ]
            }
          }
        }
      }
    adapter_quirks: |
      Per-property iteration, paginated (page_no=1..N, per_page=500).
      Primary customer is selected via customerType="Primary" filter
      (not first-in-array). Base Rent / Security Deposit are parsed from
      the scheduledCharges array with case-insensitive chargeCode match,
      with fallback to flat v.Rent / v.Deposit for legacy lease shapes.
      MoveInDate lives on the primary customer object, not the lease
      wrapper. is_mtm is a string-or-bool coerced field.
  - endpoint_name: get_lease_details
