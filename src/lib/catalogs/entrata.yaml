      The follow-up to get_lease_documents_list — call this with specific
      documentIds to fetch the actual PDF or image. Responses are large
      (megabytes of base64), so be mindful of Netlify function memory and
      response-size limits; for large documents, consider streaming the
      result to Supabase Storage on the function side and returning a
      signed URL to the client. Rate-limit-expensive because of payload
      size, not call count.
    use_cases:
      - document_library
      - lease_audit
    cost_class: expensive
    rate_limit_class: standard
    synced_to_table: null
    sync_status: not_wired
  - endpoint_name: cancel_lease
