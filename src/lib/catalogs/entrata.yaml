  - endpoint_name: get_lease_pick_list
    vendor_method: getLeasePickList
    endpoint_group: leases
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/leases
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getLeasePickList
        version: r1
        params: {}
    response_shape_summary: |
      Returns the lease-service enumeration tables. On this tenant the
      response contains exactly these collections: leaseStatusTypes,
      leaseFileTypes, chargeTimings, chargeCodeTypes, eventTypes, petTypes,
      refundMethods.

      The response does NOT carry leaseSubStatusTypes, cancel-reason codes
      or notice-reason codes. Do not plan a cancelReasonId / noticeReasonId
      enum cache off this method; the source for those is not known.
    plain_english_description: |
      The lookup-table call for the Leases service. Important because
      leaseStatusTypeIds are per-tenant in Entrata — the IDs differ
      between management companies, and passing wrong values causes
      Entrata error 306. Call this once at integration bootstrap to learn
      the tenant's mapping, cache the result, and use it for any future
      filtered queries.

      This tenant's mapping: 1 Applicant,
      2 Cancelled, 3 Future, 4 Current, 5 Notice, 6 Past. There is no
      "Evicted" id (evictions live in the leaseSubStatus TEXT field; a
      separate getEvictedLeases method exists). Note that omitting the
      leaseStatusTypeIds filter on getLeases does NOT return all statuses
      — it returns ids 4 and 5 only, so the filter has to be supplied
      explicitly to reach Past or Future leases. See the get_leases entry.
    use_cases:
      - id_resolution
      - enum_caching
    cost_class: cheap
    rate_limit_class: standard
    synced_to_table: null
    sync_status: not_wired
  - endpoint_name: get_lease_documents_list
    vendor_method: getLeaseDocumentsList
    endpoint_group: leases
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/leases
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getLeaseDocumentsList
        version: r1
        params:
          propertyId: '{property_id}'
    response_shape_summary: |
      Returns metadata for every lease-attached document on a property:
      documentId, filename, file size, MIME type, related leaseId,
      uploaded-by user, uploaded-at timestamp. Does not return the
      document binary.
    plain_english_description: |
      The two-call pattern for lease documents starts here. This returns
      the metadata roster — which lease has which documents attached, with
      their IDs. To fetch the actual file binary, follow with
      get_lease_documents on the documentId of interest. Splitting the
      pattern avoids pulling multi-megabyte PDFs for documents you do not
      need. Useful for building a document-library view scoped to a
      property or a specific lease.
    use_cases:
      - document_library
      - lease_audit
    cost_class: moderate
    rate_limit_class: standard
    synced_to_table: null
    sync_status: not_wired
  - endpoint_name: get_lease_documents
    vendor_method: getLeaseDocuments
    endpoint_group: leases
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/leases
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getLeaseDocuments
        version: r1
        params:
          documentIds: '{document_id_csv}'
    response_shape_summary: |
