      pet info, vehicle info, renewal offer status, and a deeper
      leaseInterval history. Significantly more verbose than get_leases.
    plain_english_description: |
      The deep-detail per-lease call, intended for one-off pulls when the
      lightweight get_leases row is not enough — e.g., building a tenant
      profile view or auditing a single concession schedule. Do NOT call
      this in a sync sweep across hundreds of leases; the response size
      and per-lease rate-limit cost are both prohibitive. Schema table
      entrata_lease_details exists anticipating an on-demand
      pull pattern, not a full-portfolio sync. Method is r2 in the wild;
      r1 and r3 ship different field shapes and the platform should pin
      explicitly when wiring this.
