  - endpoint_name: get_gl_transactions
    vendor_method: getGlTransactions
    endpoint_group: financials
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/financial
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getGlTransactions
        version: r1
        params:
          propertyIds: '{property_id}'
          postMonthFrom: '{MM/YYYY}'
          postMonthTo: '{MM/YYYY}'
          isDetailed: true
      page_no: <int>
      per_page: 500
    response_shape_summary: |
      Returns GL transactions for the requested property and post-month
      window: GL account, account name, post date, post month, amount
      (signed; debit positive, credit negative), reference, memo.
      Summarized by account by default; pass summarizeBy=detail to itemize
      to the source transaction.
    response_shape_verified: |
      THE DETAIL PARAMETER IS `isDetailed`, NOT `summarizeBy`. `summarizeBy`
      DOES NOT EXIST in Entrata's API: the same request with and without
      `summarizeBy: 'detail'` returns BYTE-IDENTICAL responses, roughly a
      tenth the size of the `isDetailed: true` response. getGlTransactions
      silently ignores parameters it does not know; an invalid value for a
      real parameter returns a type error instead.
      `isDetailed` accepts true / 1 / "1"; the string "yes" returns HTTP 400
      code 305 "Invalid data Type".

      VERSION r1 ONLY. `r2` -> HTTP 404 code 109, '"getGlTransactions" does
      not exist'. `r3` -> HTTP 404 code 131, "The service is not available
      with provided version".

      The account-rollup resultPath is UNCHANGED. Detail nests INSIDE each
      existing rollup node:

        response.result.properties.property[]
          "@attributes": { id }             -- the PropertyId, on `id`, NOT
              on `propertyId`
          transactions.transaction[]        -- one node per GL ACCOUNT: the
              rollup grain
            glTotal: { netChange, ..., openingBalance,
                debitOpeningBalance, creditOpeningBalance }
                                            -- the three opening-balance
                fields appear ONLY under isDetailed
            glDetails.glDetail[]            -- the journal-entry grain
              "@attributes": { id, transactionType }
              transactionDate, postMonth, postDate, debit, credit, balance,
              reference, memo, vendorName, vendorCode, apDetailId, unitId,
              unitNumber, unitDesignation, buildingId, buildingNumber,
              customTagId, customTagName, isResidentRefund

      `isDetailed` is PURELY ADDITIVE: rollup values are byte-identical
      between summary and detailed mode. Completeness holds as well -- an
      account node carrying no glDetails always has a zero netChange. Detail
      is absent only where there was genuinely no activity.

      `paginationInfo` is ABSENT IN BOTH MODES, so the page_no / per_page
      fields in the request template above are inert. Payload size is the
      only bound.

      Detail-line `postMonth` ships as "Mar,2026" (Mon,YYYY), not the MM/YYYY
      the request takes. `credit` arrives already NEGATIVE, so the footing
      identity is ADDITION: sum(debit) + sum(credit) = glTotal.netChange
      for every account. Do not "fix" it to subtraction.

      A MULTI-MONTH WINDOW COLLAPSES. postMonthFrom/postMonthTo spanning more
      than one month returns ONE account node for the whole window, carrying
      balances as-of the window END, which differ from the true
      single-month values. ONE MONTH PER CALL is required. The PROPERTY
      axis is safe at full portfolio width: every property for one month
      fits in a single call.

      Under `isDetailed` the response fans its nested lines into
      public.entrata_gl_transaction_lines via the adapter's sideTable spec;
      entrata_gl_transactions holds the account rollup, one row per
      (property, account, post_month).
    plain_english_description: |
      The raw general-ledger feed — what hit each property's books, by
      account, by post-month. There is no summarizeBy parameter (see
      response_shape_verified): the response is always one node per
      (property, account, post-month) carrying that account's balances, and
      isDetailed: true NESTS the journal-entry lines inside each of those
      account nodes rather than flattening to one row per source
      transaction. The rollup values are identical either way, so detail is
      a pure superset — 623,541 bytes against 54,606 for the same request in
      summary mode. Call one month at a time; a multi-month post-month
      window collapses to a single window-end node per account. Version r1
      only — r2 and r3 both 404. For variance-style dashboards, prefer the
      pre-joined get_budget_actuals report rather than re-implementing the
      join. Use this when you need the raw ledger — auditing a single
      account, building a custom management report, or feeding a downstream
      consolidator. Schema table entrata_gl_transactions holds the account
      rollup and is indexed on (org_id, property_id, post_month) for the
      most common query shape; the nested detail lines land in
      entrata_gl_transaction_lines.
    use_cases:
      - general_ledger_audit
      - financial_reporting
      - custom_management_report
    cost_class: expensive
    rate_limit_class: standard
    synced_to_table: entrata_gl_transactions
    sync_status: active
    wired_by: netlify/functions/_connector-adapters.js
    verify_with_partner: true
