  - endpoint_name: get_ar_transactions
    vendor_method: getLeaseArTransactions
    endpoint_group: ar
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/artransactions
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getLeaseArTransactions
        version: r1
        params:
          propertyId: '{property_id}'
          leaseIds: 1234,5678
          leaseStatusTypeIds: 3,4
          transactionTypeIds: 12345,4567
          arCodeIds: 1234,5678
          showFullLedger: '1'
          residentFriendlyMode: '0'
          includeOtherIncomeLeases: '0'
          includeReversals: '1'
          transactionFromDate: '{MM/DD/YYYY}'
          transactionToDate: '{MM/DD/YYYY}'
          ledgerIds: 1234,5678
      page_no: <int>
      per_page: 500
    response_shape_summary: |
      Returns all AR-side transactions on resident ledgers within the
      window: charges, payments, credits, write-offs, reversals. Each row
      has lease_id, customer_id, transaction date, transaction type, GL
      account, amount, memo.
    plain_english_description: |
      The raw resident-ledger feed. To compute a resident's current
      balance, summarize this on (lease_id, amount). For most reporting
      surfaces prefer the higher-level get_ar_invoices (what was billed)
      and get_ar_payments (what was paid) — composing those two is cleaner
      than working with the raw transaction stream. Use this when you
      need the full ledger detail: credits, write-offs, reversals,
      transaction memos. Paginated and per-property; expensive to refresh
      portfolio-wide so prefer narrow date windows.
    use_cases:
      - resident_ledger
      - delinquency_audit
      - financial_reconciliation
    cost_class: expensive
    rate_limit_class: standard
    synced_to_table: entrata_ar_transactions
    sync_status: defined
  - endpoint_name: get_ar_invoices
    vendor_method: getArInvoices
    endpoint_group: ar
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/artransactions
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getArInvoices
        params:
          propertyId: '{property_id}'
          leaseIds: 1234,5678
          arInvoiceId: '12345'
          fromDate: '{MM/DD/YYYY}'
          toDate: '{MM/DD/YYYY}'
      page_no: <int>
      per_page: 500
    response_shape_summary: |
      Returns AR invoices (resident charges): invoiceId, leaseId, customerId,
      invoice date, due date, total amount, status (open / paid / partial /
      void), line items with GL accounts.
    plain_english_description: |
      The "what residents owe" call. AR invoices are the high-level charge
      records; pair with get_ar_payments to compute balances. Cleaner than
      composing from get_ar_transactions (no need to filter transaction
      type, line items are pre-grouped). Use for delinquency dashboards,
      collections workflows, and resident statements.
    use_cases:
      - delinquency_dashboard
      - resident_billing
      - collections_workflow
    cost_class: expensive
    rate_limit_class: standard
    synced_to_table: entrata_ar_invoices
    sync_status: defined
  - endpoint_name: get_ar_payments
    vendor_method: getArPayments
    endpoint_group: ar
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/arpayments
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: getArPayments
        params:
          arPaymentIds: 1234,5678
          paymentStatusTypeIds: 1234,5678
          fromDate: '{MM/DD/YYYY}'
          toDate: '{MM/DD/YYYY}'
          isIncludeAllocations: '1'
      page_no: <int>
      per_page: 500
    response_shape_summary: |
      Returns AR payments (resident receipts): paymentId, leaseId, customerId,
      payment date, amount, method (cash / check / ACH / card), application
      detail (which invoice IDs were paid).
    plain_english_description: |
      The "what residents have paid" call. Pair with get_ar_invoices to
      compute outstanding balances (sum(invoices.total) - sum(payments.amount)
      per lease). Application detail shows which invoice each payment
      cleared, which matters for partial-payment scenarios and
      payment-method analysis. Per-property and paginated; date-window
      filtering is essential to keep response sizes manageable.
    use_cases:
      - collections_dashboard
      - payment_method_analysis
      - cash_flow_reporting
    cost_class: expensive
    rate_limit_class: standard
    synced_to_table: entrata_ar_payments
    sync_status: defined
  - endpoint_name: send_lease_ar_transactions
    vendor_method: sendLeaseArTransactions
    endpoint_group: ar
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/financial
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: sendLeaseArTransactions
        version: r1
        params:
          transactions: '{transaction_array}'
    response_shape_summary: |
      Returns per-transaction insertion confirmation with transaction ID
      and any validation errors.
    plain_english_description: |
      Posts a new AR charge to a lease ledger — a recurring billing
      integration, a manual one-off charge, a fee assessment. High-risk in
      this catalog because it writes financial truth on the property.
      Never call from an automated sweep without explicit ops sign-off.
    use_cases:
      - ar_billing_integration
      - fee_assessment
    cost_class: cheap
    rate_limit_class: standard
    synced_to_table: null
    sync_status: not_wired
    is_write: true
  - endpoint_name: send_lease_ar_transaction_reversals
    vendor_method: sendLeaseArTransactionReversals
    endpoint_group: ar
    http_method: POST
    gateway_url_template: https://apis.entrata.com/ext/orgs/{subdomain}/v1/financial
    request_body_template:
      auth:
        type: apikey
      requestId: <random>
      method:
        name: sendLeaseArTransactionReversals
        version: r1
        params:
          reversals: '{reversal_array}'
    response_shape_summary: |
      Returns per-reversal insertion confirmation, including the new
      reversal-transaction ID linked back to the original.
    plain_english_description: |
      Reverses a previously posted AR transaction. Entrata's pattern is
      reverse, never delete — the original transaction stays on the
      ledger and a reversing transaction is appended so the audit trail
      is preserved. Use this rather than attempting to delete a
      transaction; deletes are not supported on a closed accounting
      period and silently fail on open periods.
    use_cases:
      - ar_correction
      - audit_trail
