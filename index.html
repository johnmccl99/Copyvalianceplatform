<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F9F9FA" />
    <script src="/theme-bootstrap.js"></script>
    <title>Valiance Capital — CRE Private Equity Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      table, input[type="number"], input[type="date"], input[type="month"] {
        font-variant-numeric: tabular-nums;
      }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }
      select option { background: #fff; color: #1a1a2e; }
      @media (prefers-color-scheme: dark) { select option { background: #1e293b; color: #f1f5f9; } }

      :focus-visible { outline: 2px solid var(--ds-focus-ring, #3B82F6); outline-offset: 2px; border-radius: 2px; }

      .skip-to-content {
        position: absolute; left: 8px; top: -56px; z-index: 10000;
        padding: 10px 16px; background: var(--ds-accent-fill, #1B4F8A); color: #fff;
        border-radius: 6px; font-size: 14px; font-weight: 600;
        text-decoration: none; transition: top 0.15s ease;
      }
      .skip-to-content:focus { top: 8px; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      @media print {
        @page { size: Letter; margin: 0.5in; }
        body { background: #fff !important; }
        body * { visibility: hidden !important; }
        #report-output-panel, #report-output-panel * { visibility: visible !important; }
        #report-output-panel {
          position: absolute !important; left: 0 !important; top: 0 !important;
          width: 100% !important; max-width: none !important;
          margin: 0 !important; padding: 0 !important;
          border: none !important; box-shadow: none !important;
          background: #fff !important;
        }
        #report-output-panel > div:first-child { display: none !important; }
        h1, h2, h3, table, thead { page-break-inside: avoid; }
        thead { display: table-header-group; }
        tr { page-break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
